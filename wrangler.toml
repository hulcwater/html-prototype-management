name = "html-prototype-management"
main = "src/index.ts"
compatibility_date = "2024-07-10"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "html-prototypes"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "html-prototypes"
